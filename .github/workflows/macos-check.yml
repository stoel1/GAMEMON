name: macOS build check

on:
  push:
    branches: [macos-port]
  pull_request:
    branches: [macos-port]
  workflow_dispatch:

concurrency:
  group: macos-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GTK dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install pkg-config gtk4 libadwaita

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check macOS target
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release

      - name: Inspect release binary
        run: file target/release/gamemon

      - name: Upload macOS test binary
        uses: actions/upload-artifact@v4
        with:
          name: gamemon-macos-aarch64
          path: target/release/gamemon
          if-no-files-found: error
          retention-days: 7
